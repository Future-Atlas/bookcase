    <script>
      (() => {
        // The original publisher synchronous tag is kept unchanged in the
        // inert template below. The actual live integration uses async SDK.
        const expectedHost = "www.sharemarium.com";
        const renderedSlots = new Map();
        let entitlementToken = null;
        let entitlementState = "unknown";
        let entitlementRequest = null;
        let entitlementRetryAt = 0;

        function eligibleRoute() {
          return (
            window.location.hostname === expectedHost &&
            window.location.pathname === "/" &&
            !window.location.search.includes("seo_preview=")
          );
        }

        function currentSupabaseAccessToken() {
          try {
            for (let i = 0; i < window.localStorage.length; i += 1) {
              const key = window.localStorage.key(i) || "";
              if (!key.startsWith("sb-") || !key.endsWith("-auth-token")) continue;
              const value = window.localStorage.getItem(key);
              if (!value) continue;
              const session = JSON.parse(value);
              const token =
                session?.access_token || session?.currentSession?.access_token;
              if (typeof token === "string" && token.length > 0) return token;
            }
          } catch (_) {
            return null;
          }
          return "";
        }

        async function refreshEntitlement() {
          const token = currentSupabaseAccessToken();
          if (token === null) {
            entitlementToken = null;
            entitlementState = "ad_free";
            return;
          }
          if (!token) {
            entitlementToken = "";
            entitlementState = "ads_allowed";
            return;
          }
          if (token === entitlementToken && entitlementRequest) {
            return entitlementRequest;
          }
          if (token === entitlementToken &&
              Date.now() < entitlementRetryAt) {
            return;
          }

          entitlementToken = token;
          entitlementState = "unknown";
          entitlementRetryAt = Date.now() + 60000;
          const request = fetch("/api/ad-entitlement", {
            method: "GET",
            headers: { Authorization: "Bearer " + token },
            cache: "no-store",
          })
            .then((response) => {
              if (!response.ok) throw new Error("entitlement_check_failed");
              return response.json();
            })
            .then((body) => {
              if (entitlementToken !== token) return;
              entitlementState =
                body?.authenticated === true && body?.adFree === false
                  ? "ads_allowed"
                  : "ad_free";
            })
            .catch(() => {
              if (entitlementToken === token) {
                entitlementState = "unknown";
                entitlementRetryAt = Date.now() + 15000;
              }
            })
            .finally(() => {
              if (entitlementRequest === request) entitlementRequest = null;
            });
          entitlementRequest = request;
          return request;
        }

        function clearLoadedAdsIfDisallowed() {
          if (eligibleRoute() && entitlementState === "ads_allowed") return;
          const sdk = document.getElementById("sharemarium-admax-async-sdk");
          if (sdk) sdk.remove();
          window.__admax_tag__ = undefined;
          window.__admax_render__ = undefined;
          window.admaxads = [];
          for (const slot of renderedSlots.values()) {
            slot.target.replaceChildren();
          }
          renderedSlots.clear();
        }

        let sdkScheduled = false;
        let sdkRetryCount = 0;

        function loadAsyncSdk() {
          if (sdkScheduled) return;
          sdkScheduled = true;
          window.setTimeout(() => {
            sdkScheduled = false;
            if (!eligibleRoute() || entitlementState !== "ads_allowed" ||
                renderedSlots.size === 0 ||
                currentSupabaseAccessToken() !== entitlementToken) return;
            const old = document.getElementById("sharemarium-admax-async-sdk");
            if (old) {
              old.remove();
              window.__admax_tag__ = undefined;
              window.__admax_render__ = undefined;
            }
            const script = document.createElement("script");
            script.id = "sharemarium-admax-async-sdk";
            script.src = "https://adm.shinobi.jp/st/t.js";
            script.async = true;
            script.onerror = () => {
              for (const slot of renderedSlots.values()) {
                slot.target.setAttribute("data-admax-load", "error");
              }
              // Only retry SDK transport failures, never unfilled impressions.
              if (sdkRetryCount < 2) {
                sdkRetryCount += 1;
                window.setTimeout(loadAsyncSdk, sdkRetryCount * 3000);
              }
            };
            script.onload = () => {
              for (const slot of renderedSlots.values()) {
                slot.target.setAttribute("data-admax-load", "sdk-loaded");
              }
            };
            document.head.appendChild(script);
          }, 100);
        }

        async function mountSlot(root, attempts = 0) {
          if (!root || !eligibleRoute()) return;
          if (!root.isConnected) {
            if (attempts < 80) {
              window.setTimeout(() => void mountSlot(root, attempts + 1), 50);
            }
            return;
          }

          const rawIndex = root.getAttribute(
            "data-sharemarium-admax-slot-index",
          );
          if (rawIndex === null || !/^[0-9]+$/.test(rawIndex)) return;
          const index = Number(rawIndex);
          const id = root.getAttribute("data-sharemarium-admax-async-id") || "";
          const type = root.getAttribute("data-sharemarium-admax-async-type");
          const target = root.querySelector(
            type === "switch" ? ".admax-switch" : ".admax-ads",
          );
          if (!Number.isSafeInteger(index) || index < 0 ||
              !/^[A-Za-z0-9_-]{8,128}$/.test(id) ||
              (type !== "switch" && type !== "banner") ||
              !target || target.getAttribute("data-admax-id") !== id) return;

          const known = renderedSlots.get(index);
          if (known && known.root === root) return;
          await refreshEntitlement();
          if (!root.isConnected || !eligibleRoute() ||
              entitlementState !== "ads_allowed" ||
              currentSupabaseAccessToken() !== entitlementToken) {
            clearLoadedAdsIfDisallowed();
            return;
          }

          const latest = renderedSlots.get(index);
          if (latest && latest.root === root) return;
          if (latest) {
            latest.target.replaceChildren();
            renderedSlots.delete(index);
          }

          window.admaxads = window.admaxads || [];
          window.admaxads.push({ admax_id: id, type });
          target.setAttribute("data-admax-load", "queued");
          renderedSlots.set(index, { root, target });
          loadAsyncSdk();
        }

        function watchTimelineDom() {
          if (!document.body) return;
          const observer = new MutationObserver(() => {
            if (!eligibleRoute()) return;
            for (const root of document.querySelectorAll(
              ".sharemarium-admax-timeline-slot",
            )) {
              void mountSlot(root);
            }
          });
          observer.observe(document.body, { childList: true, subtree: true });
        }

        window.addEventListener("sharemarium:admax-slot-ready", (event) => {
          void mountSlot(event.detail);
        });

        function scheduleEntitlementReview() {
          if (!eligibleRoute()) clearLoadedAdsIfDisallowed();
          void refreshEntitlement().then(() => {
            clearLoadedAdsIfDisallowed();
            if (eligibleRoute() && entitlementState === "ads_allowed") {
              for (const root of document.querySelectorAll(".sharemarium-admax-timeline-slot")) {
                void mountSlot(root);
              }
            }
          });
        }

        // Retry transient entitlement failures without bypassing ad-free users.
        window.setInterval(() => {
          if (!document.hidden && eligibleRoute()) scheduleEntitlementReview();
        }, 60000);

        window.addEventListener("popstate", scheduleEntitlementReview);
        window.addEventListener("pageshow", scheduleEntitlementReview);
        window.addEventListener("storage", scheduleEntitlementReview);
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) scheduleEntitlementReview();
        });
        for (const method of ["pushState", "replaceState"]) {
          const original = window.history[method];
          window.history[method] = function (...args) {
            const result = original.apply(this, args);
            scheduleEntitlementReview();
            return result;
          };
        }
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", watchTimelineDom);
        } else {
          watchTimelineDom();
        }
      })();
    </script>
