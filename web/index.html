    <script>
      (() => {
        // The operator-issued Ninja AdMax script is kept verbatim in the
        // inert <template> below, and runs only inside an isolated iframe.
        const expectedHost = "www.sharemarium.com";
        const maxAdsPerPage = 3;
        const renderedSlots = new Map();
        let entitlementToken = null;
        let entitlementState = "unknown";
        let entitlementRequest = null;

        function eligibleRoute() {
          return (
            window.location.hostname === expectedHost &&
            window.location.pathname === "/" &&
            !window.location.search.includes("seo_preview=")
          );
        }

        function currentSupabaseAccessToken() {
          try {
            for (let i = 0; i < window.localStorage.length; i += 1) {
              const key = window.localStorage.key(i) || "";
              if (!key.startsWith("sb-") || !key.endsWith("-auth-token")) continue;
              const value = window.localStorage.getItem(key);
              if (!value) continue;
              const session = JSON.parse(value);
              const token =
                session?.access_token || session?.currentSession?.access_token;
              if (typeof token === "string" && token.length > 0) return token;
            }
          } catch (_) {
            return null;
          }
          return "";
        }

        async function refreshEntitlement() {
          const token = currentSupabaseAccessToken();
          if (token === null) {
            entitlementToken = null;
            entitlementState = "ad_free";
            return;
          }
          if (!token) {
            entitlementToken = "";
            entitlementState = "ads_allowed";
            return;
          }
          if (token === entitlementToken && entitlementRequest) {
            return entitlementRequest;
          }
          if (token === entitlementToken && entitlementState !== "unknown") {
            return;
          }

          entitlementToken = token;
          entitlementState = "unknown";
          const request = fetch("/api/ad-entitlement", {
            method: "GET",
            headers: { Authorization: "Bearer " + token },
            cache: "no-store",
          })
            .then((response) => {
              if (!response.ok) throw new Error("entitlement_check_failed");
              return response.json();
            })
            .then((body) => {
              if (entitlementToken !== token) return;
              entitlementState =
                body?.authenticated === true && body?.adFree === false
                  ? "ads_allowed"
                  : "ad_free";
            })
            .catch(() => {
              if (entitlementToken === token) entitlementState = "ad_free";
            })
            .finally(() => {
              if (entitlementRequest === request) entitlementRequest = null;
            });
          entitlementRequest = request;
          return request;
        }

        function clearLoadedAdsIfDisallowed() {
          if (eligibleRoute() && entitlementState === "ads_allowed") return;
          // All vendor code lives inside removable iframes, never in the
          // parent Flutter document. No SPA navigation reload is necessary.
          for (const slot of renderedSlots.values()) {
            slot.frame.removeAttribute("srcdoc");
            slot.frame.remove();
          }
          renderedSlots.clear();
        }

        async function mountSlot(root, attempts = 0) {
          if (!root || !eligibleRoute()) return;
          if (!root.isConnected) {
            if (attempts < 20) {
              window.setTimeout(() => void mountSlot(root, attempts + 1), 50);
            }
            return;
          }

          const index = Number(
            root.getAttribute("data-sharemarium-admax-slot-index"),
          );
          const target = root.querySelector(".admax-inline-target");
          if (!Number.isInteger(index) || index < 0 ||
              index >= maxAdsPerPage || !target) return;

          await refreshEntitlement();
          if (!root.isConnected || !eligibleRoute() ||
              entitlementState !== "ads_allowed" ||
              currentSupabaseAccessToken() !== entitlementToken) {
            clearLoadedAdsIfDisallowed();
            return;
          }

          const existing = renderedSlots.get(index);
          if (existing) {
            // ListView.builder may recycle the Flutter platform view on scroll.
            // Reattach the existing frame without creating a fourth placement.
            if (existing.root !== root) {
              existing.root = root;
              target.replaceChildren(existing.frame);
            }
            return;
          }
          if (renderedSlots.size >= maxAdsPerPage) return;

          const tagTemplate = document.getElementById(
            "sharemarium-ninja-admax-official-tag",
          );
          if (!tagTemplate) return;

          const frame = document.createElement("iframe");
          frame.setAttribute("title", "広告");
          frame.setAttribute(
            "sandbox",
            "allow-scripts allow-popups allow-popups-to-escape-sandbox",
          );
          frame.style.width = "100%";
          frame.style.height = "250px";
          frame.style.border = "0";
          frame.style.display = "block";
          frame.srcdoc =
            '<!doctype html><html lang="ja"><head>' +
            '<meta charset="utf-8">' +
            '<meta name="viewport" content="width=device-width,initial-scale=1">' +
            '<style>html,body{margin:0;padding:0;width:100%;height:100%;' +
            'overflow:auto;text-align:center}</style></head><body>' +
            tagTemplate.innerHTML +
            '</body></html>';

          renderedSlots.set(index, { root, frame });
          target.replaceChildren(frame);
        }

        window.addEventListener("sharemarium:admax-slot-ready", (event) => {
          void mountSlot(event.detail);
        });

        function scheduleEntitlementReview() {
          if (!eligibleRoute()) clearLoadedAdsIfDisallowed();
          void refreshEntitlement().then(clearLoadedAdsIfDisallowed);
        }

        window.addEventListener("popstate", scheduleEntitlementReview);
        window.addEventListener("pageshow", scheduleEntitlementReview);
        window.addEventListener("storage", scheduleEntitlementReview);
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) scheduleEntitlementReview();
        });
        for (const method of ["pushState", "replaceState"]) {
          const original = window.history[method];
          window.history[method] = function (...args) {
            const result = original.apply(this, args);
            scheduleEntitlementReview();
            return result;
          };
        }
      })();
    </script>
