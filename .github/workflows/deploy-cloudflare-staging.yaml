name: Deploy Flutter Web to Cloudflare Workers (Staging)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.repository == 'Future-Atlas/bookcase' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check required staging Secret names without printing values
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_REDIRECT_URL: ${{ secrets.SUPABASE_REDIRECT_URL }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          set -euo pipefail
          required=(CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_REDIRECT_URL RAKUTEN_APP_ID RAKUTEN_ACCESS_KEY)
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            # Diagnostic contains ONLY whitelisted Secret NAMES, never the values.
            printf '%s\n' "${missing[@]}" > "$RUNNER_TEMP/cloudflare-staging-missing-secret-names.txt"
            for name in "${missing[@]}"; do
              echo "::error title=Missing staging Secret name::$name"
            done
            exit 1
          fi
          echo 'All required staging Secret names are present; no values were printed.'

      - name: Upload nonsecret missing-name diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-staging-missing-secret-names
          path: ${{ runner.temp }}/cloudflare-staging-missing-secret-names.txt
          if-no-files-found: ignore
          retention-days: 1
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: |
          flutter pub get
          npm ci

      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
          npm run test:api
          npm run test:cloudflare

      - name: Build Flutter Web (Cloudflare staging)
        run: flutter build web --release --no-web-resources-cdn --dart-define=APP_ENV=staging --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} --dart-define=SUPABASE_REDIRECT_URL=${{ secrets.SUPABASE_REDIRECT_URL }}

      - name: Verify local CanvasKit engine assets
        run: node scripts/verify-local-canvaskit.mjs

      - name: Prepare Cloudflare assets
        run: npm run prepare:cloudflare

      - name: Deploy staging Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.1"
          environment: staging
          command: deploy --env staging
          secrets: |
            SUPABASE_URL
            SUPABASE_ANON_KEY
            RAKUTEN_APP_ID
            RAKUTEN_ACCESS_KEY
            ${{ secrets.RAKUTEN_AFFILIATE_ID != '' && 'RAKUTEN_AFFILIATE_ID' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}

      - name: Smoke test staging Worker
        env:
          SMOKE_BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
          EXPECT_NOINDEX: "true"
          SMOKE_DIAGNOSTIC_FILE: ${{ runner.temp }}/cloudflare-staging-smoke-diagnostic.json
        run: node scripts/cloudflare-smoke.mjs

      - name: Upload safe smoke failure classification
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-staging-smoke-diagnostic
          path: ${{ runner.temp }}/cloudflare-staging-smoke-diagnostic.json
          if-no-files-found: ignore
          retention-days: 1
