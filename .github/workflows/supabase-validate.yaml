name: Validate Supabase Migrations

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-*.yaml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        id: setup_supabase
        uses: supabase/setup-cli@v3
        with:
          version: "3.0.0"

      - name: Verify Supabase CLI
        run: supabase --version

      - name: Verify required DB files
        run: |
          test -f supabase/config.toml
          test -f supabase/seed.sql

      - name: Start local Supabase services
        run: supabase start

      - name: Reset local DB with migrations and seed
        run: supabase db reset

      - name: Run RLS tests
        run: supabase test db

      - name: Stop local Supabase services
        if: always() && steps.setup_supabase.outcome == 'success'
        run: supabase stop
