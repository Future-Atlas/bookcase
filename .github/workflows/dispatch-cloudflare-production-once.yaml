name: One-time dispatch of Cloudflare production Worker

# Temporary release bridge. This second push is intentional after the file was registered on main.
# Delete this file immediately after successful dispatch.
# This job never receives Cloudflare tokens or production application Secrets.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-cloudflare-production-once.yaml

permissions:
  actions: write
  contents: read

jobs:
  request_production_deploy:
    if: ${{ github.repository == 'Future-Atlas/bookcase' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release(cloudflare): dispatch production Worker after registration') }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the protected production workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cloudflare-production.yaml --repo Future-Atlas/bookcase --ref main --raw-field confirmation=DEPLOY
