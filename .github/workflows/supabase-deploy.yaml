name: Deploy Database to Supabase

on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-deploy.yaml"
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply the validated migrations to the production database"
        required: true
        type: boolean
        default: false
      deploy_edge_functions:
        description: "Deploy production Edge Functions (not required for featured_books)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build Flutter Web
        run: flutter build web

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: "2.115.0"

      - name: Verify required DB files
        run: |
          test -f supabase/config.toml
          test -f supabase/seed.sql

      - name: Validate production database target
        shell: bash
        run: |
          node <<'NODE'
          const raw = process.env.SUPABASE_DB_URL || "";
          if (!raw) {
            throw new Error("SUPABASE_DB_URL is not configured");
          }

          let parsed;
          try {
            parsed = new URL(raw);
          } catch {
            throw new Error("SUPABASE_DB_URL is not a valid URL");
          }

          if (!['postgres:', 'postgresql:'].includes(parsed.protocol)) {
            throw new Error("SUPABASE_DB_URL must use the postgres protocol");
          }
          if (parsed.port !== '5432') {
            throw new Error("SUPABASE_DB_URL must use the Session pooler on port 5432");
          }
          if (
            parsed.hostname !== 'pooler.supabase.com' &&
            !parsed.hostname.endsWith('.pooler.supabase.com')
          ) {
            throw new Error("SUPABASE_DB_URL must use a Supabase Session pooler host");
          }
          NODE
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Verify production token and project access (read-only)
        run: node scripts/preflight-supabase-production.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Validate migration plan
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID" -p "$SUPABASE_DB_PASSWORD"
          supabase migration list --db-url "$SUPABASE_DB_URL"
          # Production can receive migrations whose timestamp predates an already
          # applied remote migration when develop changes are promoted later.
          # --include-all keeps the repository migration history authoritative.
          supabase db push --dry-run --include-all --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Deploy database migrations
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_migrations }}
        run: |
          supabase db push --include-all --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Deploy edge functions
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_edge_functions }}
        run: |
          functions=(
            session-guard
            delete-account
            admin-delete-account
            billing-checkout
            billing-cancel-subscription
            billing-change-plan
            billing-webhook
          )

          for function_name in "${functions[@]}"; do
            supabase functions deploy "$function_name" --project-ref "$SUPABASE_PROJECT_ID"
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
