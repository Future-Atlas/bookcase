name: Deploy Database to Supabase

on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-deploy.yaml"
  workflow_dispatch:
    inputs:
      validate_only:
        description: "Only validate production credentials and migration plan (no DB or Edge Function writes)"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build Flutter Web
        run: flutter build web

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: "2.115.0"

      - name: Verify required DB files
        run: |
          test -f supabase/config.toml
          test -f supabase/seed.sql

      - name: Verify production token and project access (read-only)
        run: node scripts/preflight-supabase-production.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Validate migration plan
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID" -p "$SUPABASE_DB_PASSWORD"
          # Production can receive migrations whose timestamp predates an already
          # applied remote migration when develop changes are promoted later.
          # --include-all keeps the repository migration history authoritative.
          supabase db push --dry-run --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Record read-only validation result
        if: github.event_name == 'workflow_dispatch' && inputs.validate_only
        run: |
          echo "### Supabase production preflight" >> "$GITHUB_STEP_SUMMARY"
          echo "Read-only project token check and migration dry-run succeeded. No migrations or Edge Functions were deployed." >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy database migrations
        if: github.event_name != 'workflow_dispatch' || !inputs.validate_only
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID" -p "$SUPABASE_DB_PASSWORD"
          supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy edge functions
        if: github.event_name != 'workflow_dispatch' || !inputs.validate_only
        run: |
          functions=(
            session-guard
            delete-account
            admin-delete-account
            billing-checkout
            billing-cancel-subscription
            billing-change-plan
            billing-webhook
          )

          for function_name in "${functions[@]}"; do
            supabase functions deploy "$function_name" --project-ref "$SUPABASE_PROJECT_ID"
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
