name: Validate Cloudflare Workers Migration

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: |
          flutter pub get
          npm ci

      - name: Build Flutter Web for validation
        run: flutter build web --release --dart-define=APP_ENV=staging

      - name: Test Worker routing and generated legal sources
        run: npm run test:cloudflare

      - name: Verify generated legal source is committed
        run: git diff --exit-code -- api/_legal_sources.js

      - name: Remove Vercel-only runtime hooks from Cloudflare assets
        run: npm run prepare:cloudflare

      - name: Bundle Worker without deploying
        run: npx wrangler deploy --dry-run --env staging --outdir .wrangler/dry-run

      - name: Verify bundle and static assets
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/flutter_bootstrap.js
          ! grep -R '/_vercel/' build/web
          test -n "$(find .wrangler/dry-run -type f -name '*.js' -print -quit)"
