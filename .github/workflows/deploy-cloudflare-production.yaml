name: Deploy Flutter Web to Cloudflare Workers (Production)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY to create/update the production Worker"
        required: true

jobs:
  deploy:
    if: ${{ inputs.confirmation == 'DEPLOY' }}
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: |
          flutter pub get
          npm ci

      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
          npm run test:api
          npm run test:cloudflare

      - name: Build Flutter Web (Cloudflare production)
        env:
          NINJA_ADMAX_ASYNC_ID: "234edc1d1284546b2d177ac7c5531101"
          NINJA_ADMAX_ASYNC_TYPE: "banner"
        run: flutter build web --release --dart-define=FLUTTER_WEB_RENDERER=html --dart-define=APP_ENV=production --dart-define=NINJA_ADMAX_ENABLED=true --dart-define=NINJA_ADMAX_POSTS_PER_AD=5 "--dart-define=NINJA_ADMAX_ASYNC_ID=${NINJA_ADMAX_ASYNC_ID}" "--dart-define=NINJA_ADMAX_ASYNC_TYPE=${NINJA_ADMAX_ASYNC_TYPE}" --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} --dart-define=SUPABASE_REDIRECT_URL=${{ secrets.SUPABASE_REDIRECT_URL }}

      - name: Prepare Cloudflare assets
        run: npm run prepare:cloudflare

      - name: Deploy production Worker without changing DNS
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.1"
          command: deploy --env production
          secrets: |
            SUPABASE_URL
            SUPABASE_ANON_KEY
            RAKUTEN_APP_ID
            RAKUTEN_ACCESS_KEY
            RAKUTEN_AFFILIATE_ID
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}

      - name: Smoke test production Worker URL before DNS cutover
        env:
          SMOKE_BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
          EXPECT_NOINDEX: "true"
        run: node scripts/cloudflare-smoke.mjs
