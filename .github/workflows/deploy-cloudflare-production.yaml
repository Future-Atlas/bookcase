name: Deploy Flutter Web to Cloudflare Workers (Production)

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY to create/update the production Worker"
        required: true

permissions:
  contents: read

concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.repository == 'Future-Atlas/bookcase' && github.ref == 'refs/heads/main' && ((github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'DEPLOY')) }}
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fail closed when required production secrets are missing
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_REDIRECT_URL: ${{ secrets.SUPABASE_REDIRECT_URL }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_REDIRECT_URL RAKUTEN_APP_ID RAKUTEN_ACCESS_KEY; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Required production secret $key is not configured."
              exit 1
            fi
          done
          echo 'Production Cloudflare preflight: all required secret names are populated.'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: |
          flutter pub get
          npm ci

      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
          npm run test:api
          npm run test:cloudflare

      - name: Build Flutter Web (Cloudflare production)
        env:
          NINJA_ADMAX_ASYNC_ID: "234edc1d1284546b2d177ac7c5531101"
          NINJA_ADMAX_ASYNC_TYPE: "banner"
        run: flutter build web --release --no-web-resources-cdn --dart-define=APP_ENV=production --dart-define=NINJA_ADMAX_ENABLED=true --dart-define=NINJA_ADMAX_POSTS_PER_AD=5 "--dart-define=NINJA_ADMAX_ASYNC_ID=${NINJA_ADMAX_ASYNC_ID}" "--dart-define=NINJA_ADMAX_ASYNC_TYPE=${NINJA_ADMAX_ASYNC_TYPE}" --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} --dart-define=SUPABASE_REDIRECT_URL=${{ secrets.SUPABASE_REDIRECT_URL }}

      - name: Verify local CanvasKit engine assets
        run: node scripts/verify-local-canvaskit.mjs

      - name: Prepare Cloudflare assets
        run: npm run prepare:cloudflare

      - name: Deploy production Worker without changing DNS
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.1"
          environment: production
          command: deploy --env production
          secrets: |
            SUPABASE_URL
            SUPABASE_ANON_KEY
            RAKUTEN_APP_ID
            RAKUTEN_ACCESS_KEY
            ${{ secrets.RAKUTEN_AFFILIATE_ID != '' && 'RAKUTEN_AFFILIATE_ID' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}

      - name: Smoke test production Worker URL before DNS cutover
        env:
          SMOKE_BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
          EXPECT_NOINDEX: "true"
        run: node scripts/cloudflare-smoke.mjs
