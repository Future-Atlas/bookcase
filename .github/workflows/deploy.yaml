name: Manual Vercel Production Fallback

# The canonical production host will be Cloudflare Workers.
# Keep Vercel only as an explicit, protected rollback path.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type ROLLBACK to deploy this main commit to Vercel
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vercel-production-fallback
  cancel-in-progress: false


jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'ROLLBACK' }}
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: sharemarium
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build Flutter Web
        env:
          NINJA_ADMAX_ASYNC_ID: "234edc1d1284546b2d177ac7c5531101"
          NINJA_ADMAX_ASYNC_TYPE: "banner"
        run: flutter build web --release --dart-define=FLUTTER_WEB_RENDERER=html --dart-define=APP_ENV=production --dart-define=NINJA_ADMAX_ENABLED=true --dart-define=NINJA_ADMAX_POSTS_PER_AD=5 "--dart-define=NINJA_ADMAX_ASYNC_ID=${NINJA_ADMAX_ASYNC_ID}" "--dart-define=NINJA_ADMAX_ASYNC_TYPE=${NINJA_ADMAX_ASYNC_TYPE}" --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} --dart-define=SUPABASE_REDIRECT_URL=${{ secrets.SUPABASE_REDIRECT_URL }}

      - name: Install Vercel CLI
        run: npm install --global vercel@58.7.1

      - name: Verify Vercel Project Access
        run: vercel project inspect "$VERCEL_PROJECT_ID" --scope="$VERCEL_SCOPE"

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --scope="$VERCEL_SCOPE"

      - name: Build Vercel Prebuilt Output
        run: vercel build --prod --scope="$VERCEL_SCOPE"

      - name: Deploy Vercel fallback without changing DNS
        id: deploy_fallback
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prebuilt --prod --scope="$VERCEL_SCOPE")"
          deployment_url="$(printf '%s\n' "$deployment_url" | tail -n 1 | tr -d '\r')"
          if [[ ! "$deployment_url" =~ ^https://[^[:space:]]+\.vercel\.app/?$ ]]; then
            echo "::error::Unexpected Vercel deployment URL format."
            exit 1
          fi
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Smoke test Vercel fallback URL
        env:
          SMOKE_BASE_URL: ${{ steps.deploy_fallback.outputs.url }}
        run: node scripts/production-smoke.mjs
