name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Keep an in-flight build running so a newer run on the same ref does not
  # cancel `flutter build web --release` and report a misleading CI failure.
  cancel-in-progress: false

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Flutter dependency lockfile
        run: git diff --exit-code -- pubspec.lock

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release --no-web-resources-cdn

      - name: Verify local CanvasKit engine assets
        run: node scripts/verify-local-canvaskit.mjs

      - name: Install API dependencies
        run: npm ci

      - name: Test Vercel APIs
        run: npm run test:api

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check billing Edge Functions
        # This repository has package.json, so Deno 2 otherwise defaults to
        # manual node_modules mode. The Edge Functions use npm: imports that
        # are not installed by npm ci; auto mode lets Deno resolve them for
        # this isolated type-check without changing runtime configuration.
        run: deno check --node-modules-dir=auto supabase/functions/delete-account/index.ts supabase/functions/billing-checkout/index.ts supabase/functions/billing-cancel-subscription/index.ts supabase/functions/billing-change-plan/index.ts supabase/functions/billing-webhook/index.ts


  book_cover_sampling:
    # One-off diagnostic. Public staging endpoints only; no secrets or deploys.
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'experiment/cover-availability-100-20261102' && github.repository == 'Future-Atlas/bookcase' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - name: Checkout read-only diagnostic
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Sample up to 100 real NDL ISBNs, then openBD and fallback providers
        run: node scripts/cover-sample-100.mjs
      - name: Save result JSON (ISBN and status only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book-cover-sample-100
          path: cover-sample-100-result.json
          if-no-files-found: ignore
          retention-days: 7

  cloudflare_production:
    # Only merge/push to main can deploy; all Flutter/API/Deno CI checks
    # must succeed first. Production and staging remain separate Workers.
    needs: flutter
    if: ${{ github.repository == 'Future-Atlas/bookcase' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-cloudflare-production.yaml
    secrets: inherit
